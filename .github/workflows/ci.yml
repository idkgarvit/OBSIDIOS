name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libs (weasyprint/pango, nmap for imports)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-xlib-2.0-0 \
            libcairo2 nmap
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit pip-audit
      - name: Ruff lint
        run: ruff check .
      - name: Syntax check
        run: |
          python3 -m py_compile obsidios.py
          python3 -m py_compile config/settings.py
          python3 -m py_compile chronicle/db.py
          python3 -m py_compile chronicle/schema.py
          python3 -m py_compile chronicle/backup.py
          for f in iris/*.py oracle/*.py phantom/*.py forge/*.py sentinel/*.py shield/*.py echo/*.py dashboard/*.py alerts/*.py antibody/*.py; do
            python3 -m py_compile "$f"
          done
      - name: JavaScript syntax check
        run: node --check dashboard/static/app.js
      - name: Run tests with coverage report
        # First green runs establish the baseline; then pin --cov-fail-under=<baseline>
        run: python3 -m pytest tests/ -q --cov --cov-report=term-missing
      - name: Security static analysis
        run: bandit -r . -x ./tests,./.venv -ll -q
      - name: Dependency audit (project requirements)
        run: python3 -m pip_audit -r requirements.txt --desc

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t obsidios --no-cache .
      - name: Verify container starts
        run: docker run --rm obsidios python3 obsidios.py --help
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
