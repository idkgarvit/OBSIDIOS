[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "obsidios"
version = "1.0.0"
description = "Autonomous Predictive Network Security & Strategic Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OBSIDIOS Team"},
]

dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "asyncio-throttle>=1.0",
    "uvloop>=0.21",
    "python-nmap>=0.7",
    "scapy>=2.5",
    "netifaces>=0.11",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "anthropic>=0.28",
    "flask[async]>=3.0",
    "flask-socketio>=5.3",
    "eventlet>=0.36",
    "discord-webhook>=1.3",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "shodan>=1.31",
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "loguru>=0.7",
    "click>=8.1",
    "gunicorn>=22",
    "PyJWT>=2.8",
    "groq>=0.4",
    "weasyprint>=60",
]

[project.urls]
Source = "https://github.com/idkgarvit/OBSIDIOS"

[tool.setuptools.packages.find]
include = [
    "alerts*",
    "antibody*",
    "chronicle*",
    "config*",
    "dashboard*",
    "echo*",
    "forge*",
    "iris*",
    "oracle*",
    "phantom*",
    "sentinel*",
    "shield*",
]