services:
  caddy:
    container_name: caddy-proxy
    depends_on:
    - obsidios-dash
    image: caddy:latest
    network_mode: host
    restart: unless-stopped
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile
    - caddy_data:/data
    - caddy_config:/config
  obsidios-daemon:
    build: .
    user: root
    command:
    - python3
    - obsidios.py
    - run
    container_name: obsidios-daemon
    environment:
    - PYTHONUNBUFFERED=1
    - OBSIDIOS_ENV=${OBSIDIOS_ENV:-dev}
    - OBSIDIOS_SECRET=${OBSIDIOS_SECRET:-}
    - SHIELD_DRY_RUN=${SHIELD_DRY_RUN:-1}
    - SHIELD_ALLOWLIST=${SHIELD_ALLOWLIST:-}
    network_mode: host
    cap_add:
    - NET_RAW
    - NET_ADMIN
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f "obsidios.py run" || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
    - ./chronicle:/app/chronicle
    - ./obsidios.py:/app/obsidios.py
    - ./oracle:/app/oracle
    - ./echo:/app/echo
    - ./shield:/app/shield
    - ./forge:/app/forge
    - ./phantom:/app/phantom
    - ./iris:/app/iris
    - ./alerts:/app/alerts
    - ./logs:/app/logs
    - ./reports:/app/reports
    - ./config:/app/config
    - ./nuclei:/usr/local/bin/nuclei
    - ./nt.zip:/tmp/nt.zip
    - ./.env:/app/.env
  obsidios-dash:
    build: .
    command:
    - python3
    - obsidios.py
    - dash
    - --port
    - '8080'
    container_name: obsidios-dash
    depends_on:
    - obsidios-daemon
    environment:
    - PYTHONUNBUFFERED=1
    - OBSIDIOS_ENV=${OBSIDIOS_ENV:-dev}
    - OBSIDIOS_SECRET=${OBSIDIOS_SECRET:-}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    network_mode: host
    # Dashboard needs no raw sockets / iptables: least privilege
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)" || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
    - ./chronicle:/app/chronicle
    - ./obsidios.py:/app/obsidios.py
    - ./oracle:/app/oracle
    - ./echo:/app/echo
    - ./shield:/app/shield
    - ./forge:/app/forge
    - ./phantom:/app/phantom
    - ./iris:/app/iris
    - ./alerts:/app/alerts
    - ./dashboard:/app/dashboard
    - ./logs:/app/logs
    - ./config:/app/config
    - ./.env:/app/.env
  obsidios-echo:
    build: .
    user: root
    cap_add:
    - NET_RAW
    security_opt:
    - no-new-privileges:true
    command:
    - python3
    - obsidios.py
    - echo
    - --iface
    - eth0
    - --duration
    - '60'
    container_name: obsidios-echo
    depends_on:
    - obsidios-daemon
    environment:
    - PYTHONUNBUFFERED=1
    - OBSIDIOS_ENV=${OBSIDIOS_ENV:-dev}
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - ./chronicle:/app/chronicle
    - ./obsidios.py:/app/obsidios.py
    - ./oracle:/app/oracle
    - ./echo:/app/echo
    - ./shield:/app/shield
    - ./forge:/app/forge
    - ./phantom:/app/phantom
    - ./iris:/app/iris
    - ./alerts:/app/alerts
    - ./logs:/app/logs
    - ./config:/app/config
    - ./.env:/app/.env
  obsidios-sentinel:
    build: .
    user: root
    cap_add:
    - NET_RAW
    - NET_ADMIN
    security_opt:
    - no-new-privileges:true
    command:
    - python3
    - obsidios.py
    - sentinel
    - --iface
    - eth0
    container_name: obsidios-sentinel
    depends_on:
    - obsidios-daemon
    environment:
    - PYTHONUNBUFFERED=1
    - OBSIDIOS_ENV=${OBSIDIOS_ENV:-dev}
    - SHIELD_DRY_RUN=${SHIELD_DRY_RUN:-1}
    - SHIELD_ALLOWLIST=${SHIELD_ALLOWLIST:-}
    network_mode: host
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f "obsidios.py sentinel" || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
    - ./chronicle:/app/chronicle
    - ./obsidios.py:/app/obsidios.py
    - ./oracle:/app/oracle
    - ./sentinel:/app/sentinel
    - ./shield:/app/shield
    - ./forge:/app/forge
    - ./phantom:/app/phantom
    - ./iris:/app/iris
    - ./alerts:/app/alerts
    - ./logs:/app/logs
    - ./config:/app/config
    - ./.env:/app/.env
    - /var/log/suricata:/var/log/suricata
volumes:
  caddy_config: null
  caddy_data: null
